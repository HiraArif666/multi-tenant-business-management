version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: multi_tenant_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: multi_tenant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - multi-tenant-network

volumes:
  postgres_data:

networks:
  multi-tenant-network:
    driver: bridge